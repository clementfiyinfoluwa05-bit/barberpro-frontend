<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("tbq-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <title>TechBarberQueen — Where Technology Meets Grooming</title>
    <meta name="description" content="Professional mobile barber and grooming services in Ogba, Ikeja, Agege and Ijaiye. Book your appointment online." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
